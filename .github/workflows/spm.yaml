name: Swift Package Manager

on:
  pull_request:
    branches: [master]
    paths:
      - 'Package.swift'
      - 'spm-headers/**'
      - 'ios/**'
      - 'src/**'
      - 'package.json'
      - 'RNKeychain.podspec'
      - '.github/fixtures/spm/**'
      - '.github/workflows/spm.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: yarn install --immutable
      - name: Pack the library as published
        run: |
          yarn prepare
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Create a React Native 0.88.1 consumer
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes @react-native-community/cli@20.2.0 init KeychainSPMTest --version 0.88.1 --skip-install --skip-git-init --directory "$RUNNER_TEMP/KeychainSPMTest"
          cd "$RUNNER_TEMP/KeychainSPMTest"
          npm pkg delete 'dependencies.@react-native/new-app-screen' dependencies.react-native-safe-area-context
          npm install "$RUNNER_TEMP"/react-native-keychain-*.tgz --no-audit --no-fund
          cp "$GITHUB_WORKSPACE/.github/fixtures/spm/App.tsx" App.tsx
          npx tsc --noEmit
      - name: Set up and refresh SwiftPM
        working-directory: ${{ runner.temp }}/KeychainSPMTest/ios
        run: |
          npx react-native spm add --deintegrate --yes
          npx react-native spm update
      - name: Build Debug and Release
        working-directory: ${{ runner.temp }}/KeychainSPMTest
        run: |
          for configuration in Debug Release; do
            xcodebuild -project ios/KeychainSPMTest.xcodeproj \
              -scheme KeychainSPMTest -configuration "$configuration" \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/spm-build" \
              CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/spm-$configuration.log" 2>&1 || {
                tail -100 "$RUNNER_TEMP/spm-$configuration.log"
                exit 1
              }
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spm-build-logs
          path: ${{ runner.temp }}/spm-*.log
